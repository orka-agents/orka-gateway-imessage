apiVersion: gateway.orka.ai/v1alpha1
kind: GatewayClass
metadata:
  name: imessage-chat
  labels:
    app.kubernetes.io/name: orka-gateway-imessage
    app.kubernetes.io/component: gateway-class
spec:
  contractVersion: orka.gateway.v1
  category: chat
  capabilities:
    inboundText: true
    outboundText: true
    senderIdentity: true
    idempotentDelivery: true
    interimDelivery: true
